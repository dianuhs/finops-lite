name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run black --check finops_lite tests
      - name: Check import order
        run: uv run isort --check-only finops_lite tests
      - name: Check actionable lint errors
        run: uv run flake8 finops_lite tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run pip-audit --requirement /tmp/runtime-requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/ -q

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - name: Install and verify wheel
        run: |
          python -m venv package-smoke
          uv pip install --python package-smoke/bin/python dist/*.whl
          package-smoke/bin/finops-lite --version
      - name: Verify deterministic credential-free demo
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          package-smoke/bin/finops-lite --no-cache ccac --demo > demo-1.json
          package-smoke/bin/finops-lite --no-cache ccac --demo > demo-2.json
          cmp demo-1.json demo-2.json
